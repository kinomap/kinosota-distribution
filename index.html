<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KINOSOTA</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: Arial, sans-serif;
}

.page {
    padding: 40px;
}

h1 {
    margin: 0 0 30px 0;
    font-size: 42px;
    color: #000000;
}

p {
    font-size: 24px;
    color: #000000;
}

.button {
    display: inline-block;
    padding: 18px 30px;
    margin: 10px;
    border: 2px solid #000000;
    background: #eeeeee;
    color: #000000;
    font-size: 22px;
    text-decoration: none;
}

.button:hover {
    background: #cccccc;
}

.back {
    position: absolute;
    top: 20px;
    right: 20px;
}
</style>
</head>

<body>

<a class="button back"
   href="#"
   onclick="exitToRootApp(); return false;">
    ← НАЗАД В MSX
</a>

<div class="page">

    <h1>KINOSOTA</h1>

    <p>Ваше кино. Ваша коллекция.</p>

    <p>Добро пожаловать в KINOSOTA.</p>

    <a class="button" href="#">
        ВОЙТИ В KINOSOTA
    </a>

    <a class="button" href="#">
        УСТАНОВИТЬ НА ANDROID TV
    </a>

</div>

<script>
function exitToRootApp() {
    window.history.go(1 - window.history.length);
}
</script>

</body>
</html>
