<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KINOSOTA</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b1522;
    color: #e2e8f0;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.page {
    position: relative;
    width: 960px;
    margin: 0 auto;
    padding: 16px 20px 0 20px;
    box-sizing: border-box;
    text-align: left;
}

.back {
    position: absolute;
    top: 16px;
    right: 20px;
    display: inline-block;
    padding: 10px 20px;
    border: 2px solid #2a4463;
    background: #132235;
    color: #e2e8f0;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
}

.back:hover,
.back:focus {
    background: #1c324e;
    border-color: #58a6ff;
    outline: none;
}

.brand {
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #e2e8f0;
}

.tagline {
    margin-top: 4px;
    font-size: 20px;
    color: #94a3b8;
}

.intro {
    margin-top: 14px;
    text-align: center;
}

.intro-title {
    font-size: 28px;
    font-weight: bold;
    color: #e2e8f0;
}

.intro-text {
    margin-top: 4px;
    font-size: 22px;
    color: #94a3b8;
}

.cards {
    width: 100%;
    margin: 16px auto 0 auto;
    text-align: center;
}

.card {
    display: inline-block;
    vertical-align: top;
    width: 220px;
    margin: 0 35px;
    text-decoration: none;
    color: #e2e8f0;
    outline: none;
}

.card-image {
    display: block;
    width: 220px;
    border: 3px solid #23384f;
    background: #060d16;
}

.card-image.app-image {
    height: 220px;
}

.card-image.tv-image {
    height: 277px;
}

.card:hover .card-image,
.card:focus .card-image {
    border-color: #58a6ff;
}

.card-title {
    margin-top: 10px;
    font-size: 24px;
    font-weight: bold;
    color: #e2e8f0;
}

.card-text {
    margin-top: 4px;
    font-size: 20px;
    color: #94a3b8;
}

.footer {
    margin-top: 16px;
    text-align: center;
    font-size: 18px;
    letter-spacing: 4px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="page">

    <a class="back"
       href="#"
       onclick="exitToRootApp(); return false;">
        ← НАЗАД В MSX
    </a>

    <div class="brand">KINOSOTA</div>
    <div class="tagline">Ваше кино. Ваша коллекция.</div>

    <div class="intro">
        <div class="intro-title">Добро пожаловать</div>
        <div class="intro-text">Выберите способ просмотра</div>
    </div>

    <div class="cards">

        <a class="card"
           href="https://www.kinosota.devs.surf/app">

            <img class="card-image app-image"
                 src="img/kinosota_app.jpg"
                 width="220"
                 height="220"
                 alt="KINOSOTA">

            <div class="card-title">ВОЙТИ В KINOSOTA</div>
            <div class="card-text">
                Фильмы и сериалы на большим экране
            </div>
        </a>

        <a class="card"
           href="#"
           onclick="installAndroidTV(event); return false;">

            <img class="card-image tv-image"
                 src="img/kinosota_android_tv.jpg"
                 width="220"
                 height="277"
                 alt="KINOSOTA Android TV">

            <div class="card-title">УСТАНОВИТЬ НА ANDROID TV</div>
            <div class="card-text">
                KINOSOTA всегда с вами
            </div>
        </a>

    </div>

    <div class="footer">БОЛЬШЕ ЧЕМ ПРОСТО КИНО</div>

</div>

<script>
var KINOSOTA_APP_URL = "https://www.kinosota.devs.surf/app";

function openKinosota(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    window.location.href = KINOSOTA_APP_URL;
}

function installAndroidTV(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    return false;
}

function exitToRootApp() {
    window.history.go(1 - window.history.length);
}
</script>

</body>
</html>
