<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KINOSOTA</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

.page {
    position: relative;
    width: 960px;
    margin: 0 auto;
    padding: 20px 20px 0 20px;
    box-sizing: border-box;
    text-align: left;
}

.back {
    position: absolute;
    top: 20px;
    right: 20px;
    display: inline-block;
    padding: 10px 18px;
    border: 2px solid #3b9cff;
    background: #102b4d;
    color: #ffffff;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
}

.back:hover,
.back:focus {
    background: #174a7d;
    border-color: #75bdff;
    outline: none;
}

.brand {
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #ffffff;
}

.tagline {
    margin-top: 4px;
    font-size: 18px;
    color: #9bdcff;
}

.intro {
    margin-top: 18px;
    text-align: center;
}

.intro-title {
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
}

.intro-text {
    margin-top: 4px;
    font-size: 16px;
    color: #b8cce2;
}

.cards {
    width: 100%;
    margin: 20px auto 0 auto;
    text-align: center;
}

.card {
    display: inline-block;
    vertical-align: top;
    width: 220px;
    margin: 0 30px;
    text-decoration: none;
    color: #ffffff;
    outline: none;
}

.card-image {
    display: block;
    width: 220px;
    height: 276px;
    border: 2px solid #31587d;
    background: #000000;
}

.card:hover .card-image,
.card:focus .card-image {
    border-color: #56b4ff;
}

.card-title {
    margin-top: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
}

.card-text {
    margin-top: 4px;
    font-size: 14px;
    color: #9bdcff;
}

.footer {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 4px;
    color: #7894ad;
}
</style>
</head>

<body>

<div class="page">

    <a class="back"
       href="#"
       onclick="exitToRootApp(); return false;">
        ← НАЗАД В MSX
    </a>

    <div class="brand">KINOSOTA</div>
    <div class="tagline">Ваше кино. Ваша коллекция.</div>

    <div class="intro">
        <div class="intro-title">Добро пожаловать</div>
        <div class="intro-text">Выберите способ просмотра</div>
    </div>

    <div class="cards">

        <a class="card"
           href="https://www.kinosota.devs.surf/app">

            <img class="card-image"
                 src="img/kinosota_app.jpg"
                 width="220"
                 height="276"
                 alt="KINOSOTA">

            <div class="card-title">ВОЙТИ В KINOSOTA</div>
            <div class="card-text">
                Фильмы и сериалы на большим экране
            </div>
        </a>

        <a class="card"
           href="#"
           onclick="installAndroidTV(event); return false;">

            <img class="card-image"
                 src="img/kinosota_android_tv.jpg"
                 width="220"
                 height="276"
                 alt="KINOSOTA Android TV">

            <div class="card-title">УСТАНОВИТЬ НА ANDROID TV</div>
            <div class="card-text">
                KINOSOTA всегда с вами
            </div>
        </a>

    </div>

    <div class="footer">БОЛЬШЕ ЧЕМ ПРОСТО КИНО</div>

</div>

<script>
var KINOSOTA_APP_URL = "https://www.kinosota.devs.surf/app";

function openKinosota(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    window.location.href = KINOSOTA_APP_URL;
}

function installAndroidTV(event) {
    if (event && event.preventDefault) {
        event.preventDefault();
    }
    return false;
}

function exitToRootApp() {
    window.history.go(1 - window.history.length);
}
</script>

</body>
</html>
